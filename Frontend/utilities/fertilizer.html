<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fertilizer Calculator | AI Farmer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/toast.css">
    <link rel="stylesheet" href="utilities.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='../dashboard/dashboard.html'" title="Back to Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="icon-circle">
                <i class="fa-solid fa-flask"></i>
            </div>
            <h2>Fertilizer Calculator</h2>
            <p style="color: #718096; margin: 5px 0 0 0; font-size: 14px;">Calculate N-P-K requirements per acre</p>
        </div>

        <form id="calcForm" onsubmit="calculateFertilizer(event)">
            <div class="form-group">
                <label class="form-label">Select Crop</label>
                <select class="form-select" id="cropType" required>
                    <option value="" disabled selected>Choose a crop...</option>
                    <option value="wheat">Wheat</option>
                    <option value="rice">Rice/Paddy</option>
                    <option value="corn">Corn/Maize</option>
                    <option value="sugarcane">Sugarcane</option>
                    <option value="potato">Potato</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Field Size (Acres)</label>
                <input type="number" class="form-input" id="areaSize" step="0.5" min="0.5" placeholder="e.g. 2.5" required>
            </div>

            <button type="submit" class="calc-btn">
                <i class="fa-solid fa-calculator"></i> Calculate
            </button>
        </form>

        <div class="result-card" id="resultCard">
            <h3 style="margin: 0; font-size: 16px; color: #2e7d32; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px;">Recommended Application</h3>
            <div class="result-item">
                <span class="result-label">Urea (Nitrogen - N)</span>
                <span class="result-value" id="resUrea">0 kg</span>
            </div>
            <div class="result-item">
                <span class="result-label">DAP (Phosphorus - P)</span>
                <span class="result-value" id="resDap">0 kg</span>
            </div>
            <div class="result-item">
                <span class="result-label">MOP (Potassium - K)</span>
                <span class="result-value highlight" id="resMop">0 kg</span>
            </div>
        </div>
    </div>

    <script src="../assets/toast.js"></script>
    <script>
        // Standard NPK requirements per acre in kg (Approximate)
        const FERTILIZER_RATES = {
            wheat: { urea: 60, dap: 25, mop: 15 },
            rice: { urea: 50, dap: 20, mop: 20 },
            corn: { urea: 70, dap: 30, mop: 20 },
            sugarcane: { urea: 100, dap: 40, mop: 30 },
            potato: { urea: 50, dap: 40, mop: 40 }
        };

        function calculateFertilizer(e) {
            e.preventDefault();
            const crop = document.getElementById("cropType").value;
            const area = parseFloat(document.getElementById("areaSize").value);

            if(!crop || isNaN(area)) return showToast("Please fill all fields", "error");

            const rates = FERTILIZER_RATES[crop];
            
            document.getElementById("resUrea").textContent = (rates.urea * area).toFixed(1) + " kg";
            document.getElementById("resDap").textContent = (rates.dap * area).toFixed(1) + " kg";
            document.getElementById("resMop").textContent = (rates.mop * area).toFixed(1) + " kg";

            document.getElementById("resultCard").style.display = "flex";
            showToast("Calculated successfully!", "success");
        }
    </script>
</body>
</html>
