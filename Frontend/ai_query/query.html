<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Farmer AI Assistance | Chat Sessions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/toast.css">
    <link rel="stylesheet" href="query.css">
</head>

<body>

    <div class="main-layout">
        <aside class="sidebar glass-panel">
            <div class="user-profile" onclick="location.href='../account_page/account.html'">
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="user-info">
                    <span class="user-name" id="farmerName">Farmer</span>
                </div>
            </div>

            <div class="sidebar-top">
                <button class="new-chat-btn action-btn" onclick="startNewChat()">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
            </div>

            <div class="sidebar-label">Recent Chats</div>

            <div id="sessionList" class="session-list"></div>

            <div class="sidebar-footer">
                <button class="clear-btn action-btn logout" onclick="clearChat()">
                    <i class="fa-solid fa-trash-can"></i> Clear All History
                </button>
            </div>
        </aside>

        <div class="app-container glass-panel">
            <header>
                <div class="header-info">
                    <h2><i class="fa-solid fa-seedling"></i> Smart Farming AI</h2>
                    <p>Agronomist Support System</p>
                </div>
                <div class="header-actions">
                    <span class="status-indicator"><i class="fa-solid fa-circle-check"></i> System Online</span>
                </div>
            </header>

            <div class="chat-container" id="chatBox">
                <div class="message ai">
                    <img src="../assets/avatar.png" class="avatar">
                    <div class="bubble">
                        Hello 👋 I’m your AI farming assistant.
                        Select a previous chat from the sidebar or start a new one to begin.
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Ask about crops, pests, or soil..." />
                    <input type="file" id="imageInput" style="display:none" accept="image/*">

                    <button class="icon-btn" onclick="document.getElementById('imageInput').click()"
                        title="Analyze Leaf Image">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                </div>

                <button class="send-btn action-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i> Ask
                    AI</button>
            </div>
        </div>
    </div>

    <script src="../assets/toast.js"></script>
    <script src="query.js"></script>
</body>

</html>
