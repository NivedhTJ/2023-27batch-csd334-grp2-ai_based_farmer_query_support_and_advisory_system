<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Account Management | AI Farmer Advisory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/toast.css">
    <link rel="stylesheet" href="account.css">
</head>

<body>

    <div class="container glass-panel">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='../dashboard/dashboard.html'" title="Back to Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="avatar-circle">
                <i class="fa-solid fa-user"></i>
            </div>
            <h2>Account Settings</h2>
        </div>

        <div class="account-card">
            <div class="info-group">
                <span class="info-label"><i class="fa-solid fa-id-badge"></i> Username</span>
                <span class="info-value" id="username"></span>
            </div>
            <div class="info-group">
                <span class="info-label"><i class="fa-solid fa-fingerprint"></i> User ID</span>
                <span class="info-value" id="userId"></span>
            </div>
        </div>

        <div class="settings-section">
            <h3 class="section-title"><i class="fa-solid fa-map-location-dot"></i> Update Location</h3>
            <div class="setting-form">
                <input type="text" id="newLocation" placeholder="Enter new farming location e.g., Kerala">
                <button class="update-btn" onclick="updateLocation()">Update</button>
            </div>
        </div>

        <div class="settings-section">
            <h3 class="section-title"><i class="fa-solid fa-lock"></i> Change Password</h3>
            <div class="setting-form password-form">
                <input type="password" id="currentPassword" placeholder="Current Password">
                <input type="password" id="newPassword" placeholder="New Password">
                <button class="update-btn" onclick="updatePassword()">Update</button>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="clearHistory()">
                <i class="fa-solid fa-trash-can"></i> Clear History
            </button>
            <button class="action-btn" onclick="goToFeedback()">
                <i class="fa-solid fa-comment-dots"></i> Give Feedback
            </button>
            <button class="action-btn logout" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <script src="../assets/toast.js"></script>
    <script src="account.js"></script>
</body>

</html>
